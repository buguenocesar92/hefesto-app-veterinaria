name: CI

# Corre la verificacion unica de `api/` (herramientas/probar.sh): instala,
# migra en un PostgreSQL desechable y compara la suite con los fallos
# conocidos. No despliega ni publica nada.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Solo lectura: ningun paso escribe en el repo ni usa secretos.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (migraciones + suite)
    # Sin la variable de repositorio RUNNER_CI=xeon corre en GitHub (ubuntu-24.04).
    # Con RUNNER_CI=xeon va a una VM efimera del Xeon (Cesar pidio todo el CI ahi:
    # los runners de GitHub de esta cuenta fallan por facturacion). La VM trae
    # docker y python3, que es todo lo que usan estos pasos. Dependabot no recibe
    # `vars`: sin su termino sus PR quedarian en GitHub. Las PR desde forks van
    # SIEMPRE a GitHub: nunca codigo ajeno en hardware propio.
    runs-on: ${{ (vars.RUNNER_CI == 'xeon' || github.actor == 'dependabot[bot]') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","xeon-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verificaciones estaticas
        run: |
          python3 herramientas/verificar_caracteres.py
          python3 herramientas/verificar_estructura.py
          python3 herramientas/verificar_php_basico.py
          python3 herramientas/verificar_referencias.py

      - name: Pruebas de las herramientas
        run: python3 -m unittest discover -s herramientas -p 'test_*.py'

      - name: Verificacion de api/
        run: bash herramientas/probar.sh

      - name: Imagen de produccion
        run: bash herramientas/verificar_imagen.sh
