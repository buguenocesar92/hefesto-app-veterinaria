# =============================================================================
# Hefesto Studio — VeterinariaHefesto: desarrollo
# =============================================================================
# PUBLICACA PUERTOS A proposito: en desarrollo se entra por el navegador y se
#_revisiona la interfaz desde la maquina.
#
# En produccion se usa docker-compose.prod.yml, donde solo Caddy publica.
# =============================================================================

name: veterinaria-dev

services:

  # -------------------------------------------------------------------------
  # PostgreSQL.
  #
  # DOS ROLES, Y NO UNO
  # -------------------
  # `POSTGRES_USER` es el rol de ARRANQUE: la imagen oficial ejecuta
  # `initdb --username="$POSTGRES_USER"` y ese rol nace superusuario. Solo
  # se usa para crear la base y para las tareas administrativas. La
  # aplicacion NUNCA conecta con el.
  #
  # El rol de la aplicacion (`DB_USERNAME`) lo crea
  # `deploy/postgres/inicializar-rol.sh` al inicializar el volumen, con
  # NOSUPERUSER y NOBYPASSRLS explicitos. Le da la propiedad de la base
  # para que las migraciones de Laravel puedan crear el esquema.
  #
  # POR QUE IMPORTA: la documentacion de PostgreSQL 18 dice que los
  # superusuarios "always bypass the row security system", y que
  # `FORCE ROW LEVEL SECURITY` sujeta solo al DUENO de la tabla, no al
  # superusuario. Con un solo rol las politicas no se aplicarian y el
  # aislamiento entre empresas seria decorativo. Ver docs/03.
  # -------------------------------------------------------------------------
  postgres:
    image: "docker.io/library/postgres:18.6"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-veterinaria}
      POSTGRES_USER: ${DB_ADMIN_USERNAME:-veterinaria_admin}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?falta DB_ADMIN_PASSWORD en el .env}
      # Rol con el que conecta la aplicacion. Lo crea el script de arranque.
      APP_DB_ROLE: ${DB_USERNAME:-veterinaria}
      APP_DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en api/.env}
    ports:
      # Solo para mirar la base desde una herramienta de escritorio. En
      # produccion este puerto NO se publica.
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/inicializar-rol.sh:/docker-entrypoint-initdb.d/inicializar-rol.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-veterinaria} -d ${DB_DATABASE:-veterinaria}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: "docker.io/library/redis:8.8.3-alpine"
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../api/.env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - storage:/var/www/html/storage
      - bootstrap:/var/www/html/bootstrap/cache
      # El codigo se monta para no tener que reconstruir en cada cambio.
      - ../api:/var/www/html

  worker:
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../api/.env
    environment:
      APP_ENV: local
    entrypoint: ["/usr/local/bin/entrypoint-worker.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../api:/var/www/html

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    restart: unless-stopped
    environment:
      NUXT_API_BASE: http://api:8000
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ../web:/app

volumes:
  postgres:
    name: veterinaria_dev_postgres
  redis:
    name: veterinaria_dev_redis
  storage:
    name: veterinaria_dev_storage
  bootstrap:
    name: veterinaria_dev_bootstrap
