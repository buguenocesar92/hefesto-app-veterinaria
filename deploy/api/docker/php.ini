; =============================================================================
; PHP de VeterinariaHefesto
; =============================================================================
; Los limites de memoria y de tiempo se ajustaron para una peticion que puede
; ser pesada: la ficha clinica de una mascota con veinte anos de historial.
; =============================================================================

memory_limit = 256M

; El limite de tiempo tiene que ser MAYOR que el de nginx, para que sea nginx
; quien responde primero y no php a mitad de una consulta.
max_execution_time = 60

default_socket_timeout = 30

; Las SESIONES LAS MANEJA LARAVEL, no PHP.
;
; Este archivo NO fija `session.save_handler`: dejaria a PHP escribiendo las
; sesiones en archivos locales, que es exactamente lo que NO se quiere. La
; sesion vive en PostgreSQL (ver config/session.php) porque una sesion
; autoriza el acceso a una ficha clinica y no puede depender de un disco que
; se puede perder o que no se comparte entre replicas.
;
; Fijar `session.save_handler = files` aqui seria un fallo silencioso: la
; aplicacion arrancaria y cada peticion crearia su sesion sin persistirla, y
; nadie se enteraria hasta que un usuario perdiera su sesion al cambiar de
; replica.

; Errores: nada de mostrarlos en pantalla. Con datos de salud, una traza en la
; respuesta es una fuga.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; Zona horaria por omision. La de cada clinica se ajusta en su fila.
date.timezone = America/Santiago

default_charset = "UTF-8"

; En una base en UTF-8, con la regla de comparacion que declara
; config/database.php.
mbstring.internal_encoding = "UTF-8"

; Sesion del navegador: cookie HttpOnly y SameSite, que son los dos controles
; que evitan que roben la sesion. El valor concreto (secure, same_site) se
; ajusta en config/session.php.
session.use_strict_mode = 1
session.cookie_httponly = 1

; OpCache en la interfaz de linea de comandos, que es donde mas se repite.
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
