# =============================================================================
# Hefesto Studio — VeterinariaHefesto: nginx dentro del contenedor de la API
# =============================================================================
# nginx recibe la peticion y la pasa a php-fpm.
#
# LA CONFIGURACION ES DELIBERADAMENTE PEQUENA
# -------------------------------------------
# Este nginx NO es la puerta de entrada a la aplicacion: eso es Caddy, desde
# afuera. Este es un proxy interno entre nginx y php-fpm, dentro del mismo
# contenedor.
#
# Por eso NO hay certificados, ni `server_name`, ni reglas de seguridad: de
# esas se encarga Caddy. Duplicarlas aca seria mantener la misma regla en dos
# lugares, y los lugares se desincronizan.
# =============================================================================

user appuser;
worker_processes auto;

error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # La cabecera de seguridad principal la pone Caddy. Acu se refuerza una que
    # nginx puede aplicar sin conocer el dominio.
    server_tokens off;

    server {
        listen 8000;
        server_name _;

        root /var/www/html/public;
        index index.php;

        client_max_body_size 8M;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            # `try_files` con `/index.php` en la ultima condicion: si el archivo
            # PHP no existe, no se ejecuta. Es lo que impide que se sirva el
            # contenido de un archivo PHP como texto.
            try_files $uri =404;

            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;

            # El limite de PHP es mas alto que el de nginx (ver php.ini): es
            # nginx quien corta primero, para no dejar una consulta a medias.
            fastcgi_read_timeout 90;

            # Las cabeceras que llegan desde Caddy.
            fastcgi_param HTTP_COOKIE $http_cookie;
            fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        }

        # Un archivo `.php` en cualquier subcarpeta se ejecuta, pero un archivo
        # que no sea `.php` no se sirve con el motor. Por ejemplo, un `.env` en
        # la raiz no es alcanzable como archivo: no existe ruta que lo sirva.
        location ~ /\. {
            deny all;
        }

        # La carpeta de almacenamiento y la de codigo nunca se sirven.
        location ~ ^/(storage|vendor|bootstrap/app\.php) {
            deny all;
        }
    }
}
