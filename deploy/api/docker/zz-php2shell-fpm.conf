; =============================================================================
; Reciclaje de los trabajadores: CVE-2026-109618 / CVE-2026-109619 (PHP2Shell)
; =============================================================================
;
; QUE HACE
; --------
; `pm.max_requests = 100` hace que php-fpm termine el proceso hijo despues de
; 100 peticiones y levante uno nuevo. Un proceso de PHP comprometido deja de
; estar comprometido cuando muere, y 100 peticiones es un numero que no se nota
; en el servicio.
;
; SIN ESTO
; --------
; php-fpm usa 500 peticiones por trabajador por omision (en `www.conf` viene
; comentado: `;pm.max_requests = 500`), o sea que un trabajador vulnerable vive
; cinco veces mas.
;
; POR QUE EL NOMBRE EMPIEZA POR `zz-`
; ------------------------------------
; `/usr/local/etc/php-fpm.d/*.conf` se incluye en ORDEN ALFABETICO (ver el
; `include=` de `/usr/local/etc/php-fpm.conf`). Con `zz-` este es el ULTIMO
; archivo que se lee, despues de `www.conf` y de `zz-docker.conf`: asi este
; valor gana aunque la imagen oficial vuelva a fijar el suyo.
;
; El contenedor corre `php-fpm` (lo levanta supervisord; ver
; deploy/api/docker/supervisord.conf), asi que el reciclaje se hace por
; el pool de php-fpm.
;
; CVE-2026-109618 / CVE-2026-109619 - PHP2Shell - 2026-10-22
; -----------------------------------------------------------------------------

[www]
pm.max_requests = 100
